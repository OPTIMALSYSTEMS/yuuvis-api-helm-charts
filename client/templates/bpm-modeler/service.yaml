{{- if .Values.yuuvis.bpm.modeler.enabled -}}
apiVersion: v1
kind: Service
metadata:
  labels:
    app: {{.Values.yuuvis.labels.app}}
    yuuvis: "true"
    name: bpm-modeler
  name: bpm-modeler
spec:
  ports:
  - name: http
    port: 80
    protocol: TCP
    targetPort: 8080
  selector:
    name: bpm-modeler
  type: ClusterIP
{{- end }}