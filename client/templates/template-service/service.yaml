{{- if .Values.yuuvis.client.templateservice.enabled -}}
apiVersion: v1
kind: Service
metadata:
  labels:
    app: {{.Values.yuuvis.labels.app}}
    yuuvis: "true"
    name: template-service
  name: template-service
spec:
  ports:
  - name: http
    port: 80
    protocol: TCP
    targetPort: 8080
  selector:
    name: template-service
  type: ClusterIP
{{- end }}