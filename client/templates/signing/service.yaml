{{- if .Values.yuuvis.client.signing.enabled -}}
apiVersion: v1
kind: Service
metadata:
  labels:
    app: {{.Values.yuuvis.labels.app}}
    yuuvis: "true"
    name: signingservice
  name: signingservice
spec:
  ports:
  - name: http
    port: 80
    protocol: TCP
    targetPort: 7561
  selector:
    name: signingservice
  type: ClusterIP
{{- end }}
