        #  cpu:
        #limits:
        #  memory:
        #  cpu: 
      nodeSelector: {}
      priorityClassName: ""
      tolerations: []
      nodeAffinity: {}
      podAffinity: {}
      podAntiAffinity: {}
    architect:
      enabled: true
      dockerImage: yuuvis/architect:2.8.0
      instances: 1
      resources:
        requests:
          memory: "64Mi"
        #  cpu:
        #limits:
        #  memory:
        #  cpu: 
