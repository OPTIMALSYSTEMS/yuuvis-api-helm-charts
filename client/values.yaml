        <sequenceFlow id="sid-5AF8A29A-32AA-498A-AB1F-55312F4CFC0C" sourceRef="sid-D5A58D9D-EF9F-4928-B35D-7ED1962D64EC" targetRef="sid-A6328636-A586-472E-8F4D-98D20576CF40"></sequenceFlow>
        <exclusiveGateway id="sid-1C2E35D9-0C4C-4F32-AD26-6B24D6EBD135"></exclusiveGateway>
        <exclusiveGateway id="sid-F092ADC3-8923-48B4-823F-6FAD5B6B07A3" default="sid-CD8EA910-039E-43A1-8563-11C4AB04E6C5"></exclusiveGateway>
        <scriptTask id="sid-7EDA9179-533E-4316-8F73-96A83BE917EC" name="init inner loop variables" scriptFormat="groovy" flowable:autoStoreVariables="false">
          <script><![CDATA[import com.fasterxml.jackson.databind.JsonNode;
    import com.fasterxml.jackson.databind.ObjectMapper; 
    import java.text.SimpleDateFormat

    ObjectMapper objectMapper = new ObjectMapper()

    //set process variables from the taskList table
    execution.setVariable("title", taskList[0].get("title").textValue())
    execution.setVariable("taskStatus", "Open")
    execution.setVariable("note", "")

    /* set who will work on the next task from OrgSet that is kept in table in variable nextAssignee
    nextAssignee is of client OrgSet type: an array that contains strings and these strings are stringified JSONs:

    "nextAssignee":["{\"id\":\"00d5e4f1-a960-423f-867e-f1fc0fd4daa2\",\"title\":\"USER TITLE\",\"type\":\"user\"}","{\"id\":\"YUUVIS_DEFAULT\",\"title\":\"YUUVIS_DEFAULT\",\"type\":\"role\"}"]

    */

    def users=new HashSet<String>()
    def roles=new HashSet<String>()

    execution.setVariable("nextAssignee", taskList[0].get("nextAssignee"))

    for (final Iterator<JsonNode> i = nextAssignee.elements(); i.hasNext(); ) {
      def JsonNode strElement= i.next(); //string from array that has to be parsed into JsonNode
      def JsonNode element= objectMapper.readTree(strElement.textValue());
      if(element.get("type").textValue().equals("role")) {
          roles.add(element.get("id").textValue())
        } else if(element.get("type").textValue().equals("user")) {
          users.add(element.get("id").textValue())
        }
    }

    def strLenUsers = users.toString().length()
    def strLenRoles = roles.toString().length()
    //set process variables for user and role candidates in CSV format (https://www.flowable.com/open-source/docs/bpmn/ch07b-BPMN-Constructs/#user-assignment)
    execution.setVariable("userCandidates", users.toString().substring(1,strLenUsers-1))
    execution.setVariable("roleCandidates", roles.toString().substring(1,strLenRoles-1))

    //set flags for UserTask, so that we know which (candidate) assignment to use
    def directAssignment = ( roles.size()==0 && users.size()==1 )
    def candidateRolesAssignment = (roles.size()>0)
    def candidateUsersAssignment = (users.size()>1) || (users.size()==1 && candidateRolesAssignment)

    execution.setVariable("directAssignment", directAssignment)
    execution.setVariable("candidateUsersAssignment", candidateUsersAssignment)
    execution.setVariable("candidateRolesAssignment", candidateRolesAssignment)

    // JUELs for User Task:
    // ${directAssignment ? userCandidates : null }
    // ${candidateUsersAssignment ? userCandidates : null }
    // ${candidateRolesAssignment ? roleCandidates : null }


    def expiry = taskList[0].get("expiryDatetime")
    def expiryDate = null
    if( expiry != null ) {
      expiryDate=new SimpleDateFormat("yyyy-MM-dd'T'HH:mm").parse(expiry.textValue())
    }
    execution.setVariable("expiryDatetime", expiryDate)

    //remove first item in the taskList table (array)
    if (taskList.isArray()) {
      for (final Iterator<JsonNode> i = taskList.elements(); i.hasNext(); ) {
        i.next();
        i.remove();
        break;
      }
    }]]></script>
        </scriptTask>
