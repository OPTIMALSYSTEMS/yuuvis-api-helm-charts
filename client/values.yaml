yuuvis:
  labels:
    app: yuuvis
  image:
    imagePullPolicy: Always
    imagePullSecret: yuuvisorg
    dockerRegistry: docker.yuuvis.org
  configservice:
    url: http://system/config
  system:
    url: http://system
  # set environment variables that should be used in every container
  # e.g. time zone (TZ)
  # the whole block will be added to the environment variables in the containers
  common:
    env: 
    #example:
    #env:
    #  - name: TZ
    #    value: "Europe/Berlin"
  init:
    configuser:
      # the init container for the 'client' and 'clients' service will
      # add the required apps, i18n and wokrflow configurations for the services
      # therefore an yuuvis user with the role 'YUUVIS_SYSTEM_INTEGRATOR' is required
      secretname: configure-apps
      # if true a secret secretName is created with
      # values of user, tenant, password
      createnewsecret: true
      tenant: myfirsttenant
      username: root
      password: changeme
  apps:
  # the apps 'client' and 'clientsystem' are required by the client (no 's') service
    client:
      enabled: true
    clientsystem:
      enabled: true
    ai:
      enabled: true
  # workflow used by the clients (with an 's') service
  # this requires a running bpm-engine
  # the bpm-engine can be installed via the bpm helm chart
  taskflow:
    enabled: true
  livenessProbe:
    enable: false
    initialDelaySeconds: 300
    periodSeconds: 30
    timeoutSeconds: 10
  readinessProbe:
    enable: true
    initialDelaySeconds: 0
    periodSeconds: 30
    timeoutSeconds: 5
  securityContext:
    fsGroup: 1000
    runAsGroup: 1000
    runAsUser: 1000
    runAsNonRoot: true
  bpm:
    engine:
      enabled: true
      dockerImage: yuuvis/bpm-engine:0.19.3
      initContainerImage: yuuvis/helper/init-helper:2023-12-03
      profiles: dbspostgres,swagger,oauth2
      instances: 1
      pdb:
        # pdb requires instances > 1 and minAvailable < instances,
        # otherwise draining nodes will deadlock! 
        enabled: false

        # set `minAvailable: null` if you want to use maxUnavailable instead
        minAvailable: 1
      nodeSelector: {}
      priorityClassName: ""
      tolerations: []
      nodeAffinity: {}
      podAffinity: {}
      podAntiAffinity: {}
      java:
        maxHeap: -Xmx128m
      resources:
        requests:
          memory: "512Mi"
        #  cpu:
        #limits:
        #  memory:
        #  cpu: 
      spring:
        datasource:
          hikari:
            minimumIdle: 10
            maximumPoolSize: 100
      configyml: |
        # only one idm provide can be enabled at the same time
        bpm:
          engine:
            idm:
              keycloak:
                enabled: true
                server: 'http://keycloak-http.infrastructure/auth'
                admin:
                  username: 'keycloak'
                  password: 'changeme'
              # to use a custom identity provider that implements the Custom IDM API
              custom:
                enabled: false
                base-url: 'http://my-custom-idm-provider/api'
                # for example
                #base-url: 'http://tenant-management/api/idm'
      database:
        # user and password used by the bpm service to access the desired database
        name: themis
        user: bpmusr
        password: changeme
        port: "5432"
        address: postgresql.infrastructure
        createdb: true
        # for postgres systems the database an optional init job can be used to create 
        # the database
        # if createdb is 'true' 
        # the following user is used to test if the database and user exists
        # and if they dont exit, to create the database, the user and
        # grand the user privileges for the database
        # the privilege user must have the rights to create databases, users
        # and grand privileges to users
        privilege:
          user: postgres
          password: changeme
    modeler:
      enabled: true
      dockerImage: yuuvis/bpm-modeler:0.3.2
      initContainerImage: yuuvis/helper/init-helper:2023-12-03
      profiles: dbspostgres,swagger
      instances: 1
      pdb:
        # pdb requires instances > 1 and minAvailable < instances,
        # otherwise draining nodes will deadlock! 
        enabled: false

        # set `minAvailable: null` if you want to use maxUnavailable instead
        minAvailable: 1
      nodeSelector: {}
      priorityClassName: ""
      tolerations: []
      nodeAffinity: {}
      podAffinity: {}
      podAntiAffinity: {}
      java:
        maxHeap: -Xmx128m
      resources:
        requests:
          memory: "512Mi"
        #  cpu:
        #limits:
        #  memory:
        #  cpu: 
      database:
        name: bpmmodel
        user: bpmusr
        password: changeme
        port: "5432"
        address: postgresql.infrastructure
        createdb: true
        # for postgres systems the database an optional init job can be used to create 
        # the database
        # if createdb is 'true' 
        # the following user is used to test if the database and user exists
        # and if they dont exit, to create the database, the user and
        # grand the user privileges for the database
        # the privilege user must have the rights to create databases, users
        # and grand privileges to users
        privilege:
          user: postgres
          password: changeme
  client:
    apiweb:
      enabled: true
      dockerImage: yuuvis/api-web:1.25.3
      profiles: prod,kubernetes,redis
      instances: 1
      pdb:
        # pdb requires instances > 1 and minAvailable < instances,
        # otherwise draining nodes will deadlock!
        enabled: false

        # set `minAvailable: null` if you want to use maxUnavailable instead
        minAvailable: 1
      nodeSelector: {}
      priorityClassName: ""
      tolerations: []
      nodeAffinity: {}
      podAffinity: {}
      podAntiAffinity: {}
      java:
        maxHeap: -Xmx512m
      resources:
        requests:
          memory: "512Mi"
        #  cpu:
        #limits:
        #  memory:
        #  cpu: 
    userservice:
      enabled: true
      dockerImage: yuuvis/userservice:1.17.2
      initContainerImage: yuuvis/helper/init-helper:2023-12-03
      profiles: dbspostgres
      instances: 1
      pdb:
        # pdb requires instances > 1 and minAvailable < instances,
        # otherwise draining nodes will deadlock!
        enabled: false

        # set `minAvailable: null` if you want to use maxUnavailable instead
        minAvailable: 1
      nodeSelector: {}
      priorityClassName: ""
      tolerations: []
      nodeAffinity: {}
      podAffinity: {}
      podAntiAffinity: {}
      java:
        maxHeap: -Xmx128m
      resources:
        requests:
          memory: "512Mi"
        #  cpu:
        #limits:
        #  memory:
        #  cpu: 
      database:
        name: erebus
        user: erebus
        password: changeme
        port: "5432"
        address: postgresql.infrastructure
        createdb: true
        # for postgres systems the database an optional init job can be used to create 
        # the database
        # if createdb is 'true' 
        # the following user is used to test if the database and user exists
        # and if they dont exit, to create the database, the user and
        # grand the user privileges for the database
        # the privilege user must have the rights to create databases, users
        # and grand privileges to users
        privilege:
          user: postgres
          password: changeme
    client:
      enabled: true
      initContainerImage: yuuvis/sam:2025.4.6
      dockerImage: yuuvis/client:6.5.0
      instances: 1
      pdb:
        # pdb requires instances > 1 and minAvailable < instances,
        # otherwise draining nodes will deadlock!
        enabled: false

        # set `minAvailable: null` if you want to use maxUnavailable instead
        minAvailable: 1
      resources:
        requests:
          memory: "64Mi"
        #  cpu:
        #limits:
        #  memory:
        #  cpu: 
      nodeSelector: {}
      priorityClassName: ""
      tolerations: []
      nodeAffinity: {}
      podAffinity: {}
      podAntiAffinity: {}
    clients:
      enabled: true
      initContainerImage: yuuvis/sam:2025.4.6
      dockerImage: yuuvis/clients:2.8.3
      instances: 1
      pdb:
        # pdb requires instances > 1 and minAvailable < instances,
        # otherwise draining nodes will deadlock!
