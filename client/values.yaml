      <process id="osdrive_adhoc_demo" name="OS Drive Adhoc Workflow - Demo Version" isExecutable="true">
        <documentation>OS-Drive Ad-Hoc (uses OrgSet instead of single user assignment)</documentation>
        <dataObject id="timerInPast" name="timerInPast" itemSubjectRef="xsd:boolean">
          <extensionElements>
            <flowable:value>false</flowable:value>
          </extensionElements>
        </dataObject>
