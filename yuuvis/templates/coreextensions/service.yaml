{{- if .Values.yuuvis.services.coreextensions.enabled }}
apiVersion: v1
kind: Service
metadata:
  labels:
    app: {{.Values.yuuvis.labels.app}}
    name: core-extensions
    yuuvis: "true"
  name: core-extensions
spec:
  ports:
  - name: "http"
    port: 80
    targetPort: {{.Values.yuuvis.services.coreextensions.port}}
  selector:
    name: core-extensions
  type: ClusterIP
{{- end -}}