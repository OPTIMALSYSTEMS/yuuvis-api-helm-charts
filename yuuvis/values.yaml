imageCredentials:
  yuuvisorg:
    registry: docker.yuuvis.org
    username:
    password:

yuuvis:
  keycloak:
    # !!! Change before  running 
    # this variable must contain the "public" ip of keycloak
    # this ip will be sent to the user from the authentication service
    publicaddress: 192.168.99.100:30111/auth
    clusterurl: http://keycloak-http.infrastructure/auth
    # this realm will be used in the authentication-prod yml to limit the access to 
    # endpoints to a dedicated system tenant
    # before running change the value to an existing realm 
    # TODO: changeme
    system:
      realm: myfirsttenant
  git:
    protocol: http
    url: gitea-http.infrastructure:3000/yuuvis/yuuvis-config.git
    server: gitea-http.infrastructure:3000
    # please not that since infrastructure helm chart 0.9.0 gitea is used 
    # in previous versions gogs was used
    # url: gogs.infrastructure/yuuvis/yuuvis-config.git
    # server: gogs.infrastructure
    name: yuuvis-config
    user: yuuvis
    password: changeme
    email: yuuvis@example.com
    branch: master
  init:
    docker:
      image: yuuvis/helper/init-realm
      tag: 24_v7
    # if enabled the config-init job will create a realm in keycloak with the 
    # name from yuuvis.init.keycloak.realm.name 
    # and an user with all yuuvis roles 
    createrealm: true
    app:
      osdrive:
      # control if the app 'osdrive' should be added while running the system init container
        enabled: true
    system:
      # control if the files defined by 'yuuvis.systemschema' etc. should be added while running the system init container
      # the init container always copies the files if enabled
      # WARN: existing configurations in system folder in the cluster will be overwritten
      schema:
        enabled: false
      roleset:
        enabled: true
      systemHookConfiguration:
        enabled: true
      serviceConfiguration:
        enabled: true
    keycloak: 
      url: "http://keycloak-http.infrastructure/auth"
      admin: "keycloak"
      password: "changeme"
      realm:
        name: "myfirsttenant"
        user: "root"
        password: "changeme"
        # required in keycloak
        # if missing keycloak will show a form to add the address
        # this will break the yuuvis login
        email: email@example.com
    # !!! Change before running
    # this variable must contain the "public" ip of the authentication service
    # this variable will be used by keycloak e.g. checked if it matches the redirect uri during login
    authurl: "http://192.168.99.100:30080"
    # k8s job config
    nodeSelector: {}
    priorityClassName: ""
    tolerations: []
    nodeAffinity: {}
    podAffinity: {}
    podAntiAffinity: {}
  amqp:
    user: rodger
    password: changeme
    url: rabbitmq.infrastructure
    port: 5672
  db:
    name: yuuvis
    server: postgresql.infrastructure:5432
    user: yuuvis
    password: changeme
  elastic:
    url: elasticsearch.infrastructure
    init:
      index:
        name: yuuvis
        number_of_shards: 3
        number_of_replicas: 1
  redis:
    host: redis-master.infrastructure
    port: 6379
  authconfig: |
    routing.defaultEntryPoint: '/client/index.html'

    management.server.port: {{.Values.yuuvis.services.authentication.managePort}}
    management.server.servlet.context-path: /
    management:
      endpoints:
        web:
          base-path: /manage
          exposure:
            include:
            - health
            - info
            - refresh
      endpoint:
        refresh:
          enabled: true
        info:
          enabled: true
        health:
          enabled: true

    authorization.accesses:
    ### Manage-Endpunkte
      - endpoints: /manage/**
        expose: true
      - endpoints: /*/manage/**
        access: hasAuthority('YUUVIS_SYSTEM_INTEGRATOR') and authentication.details.get('tenant') == '{{.Values.yuuvis.keycloak.system.realm}}'
    ### internal service account endpoints
      - endpoints: /session/invalidateAll/**,/jwt/token
    ### API-Endpunkte
      - endpoints: /api/system/**
        access: hasAuthority('YUUVIS_SYSTEM_INTEGRATOR') and authentication.details.get('tenant') == '{{.Values.yuuvis.keycloak.system.realm}}'
      - endpoints: /api/admin/**
        access: hasAuthority('YUUVIS_TENANT_ADMIN')
      - endpoints: /api/dms/**
    ### Endpunkte für Swagger-Webclient des API-Gateways
      - endpoints: /api/swagger-ui.html/**,/api/**/springfox-swagger-ui/**,/api/**/swagger-resources/**,/api/**/v2/api-docs/**
      - endpoints: /api/swagger-ui/**,/api/swagger/v3/api-docs/**
    ### Webclient
      - endpoints: /search/**,/viewer/**,/architect/**
      - endpoints: /client/**
        expose: true
      - endpoints: /clients/**
        expose: true
    ### bpm-engine
      - endpoints: /bpm-engine/swagger-ui.html,/bpm-engine/swagger-ui/**,/bpm-engine/v2/api-docs/**,/bpm-engine/v3/api-docs/**
      - endpoints: /bpm-engine/api/**
      - endpoints: /bpm-engine/internal/**
        access: hasAuthority('YUUVIS_SYSTEM_INTEGRATOR') and authentication.details.get('tenant') == '{{.Values.yuuvis.keycloak.system.realm}}'
    ### BPM-Modeler
      - endpoints: /bpm-modeler/**
        access: hasAuthority('YUUVIS_TENANT_ADMIN') 
    ### api-web
      - endpoints: /api-web/swagger-ui.html,/api-web/swagger-ui/**,/api-web/**/v3/api-docs/**
      - endpoints: /api-web/api/resources/**,/api-web/api/users/**,/api-web/api/bpm/**,/api-web/api/dms/**,/api-web/api/idm/**
      - endpoints: /api-web/api/system/**
        access: hasAuthority('YUUVIS_SYSTEM_INTEGRATOR') and authentication.details.get('tenant') == '{{.Values.yuuvis.keycloak.system.realm}}'
      - endpoints: /api-web/api/admin/**
        access: hasAuthority('YUUVIS_TENANT_ADMIN') 
    ### tenant-management
      - endpoints: /tenant-management/swagger-ui.html,/tenant-management/swagger-ui/**,/tenant-management/**/v3/api-docs/**
      - endpoints: /tenant-management/api/system/**
        access: hasAuthority('YUUVIS_SYSTEM_INTEGRATOR') and authentication.details.get('tenant') == '{{.Values.yuuvis.keycloak.system.realm}}'
      - endpoints: /tenant-management/api/admin/**
        access: hasAuthority('YUUVIS_TENANT_ADMIN')
      - endpoints: /tenant-management/api/admin/users/**
        access: hasAnyAuthority('YUUVIS_MANAGE_SETTINGS')
      - endpoints: /tenant-management/api/idm/**
    ### office 365
      - endpoints: /office365/**
      - endpoints: /dashlet365/**  
      {{- if and .Values.yuuvis.services.coreextensions.enabled .Values.yuuvis.services.coreextensions.config.webdav.nginxingress.enabled }}
    ### core-extensions
      - endpoints: /core-extensions/webdav/**
        expose: true
      {{- end}}
    ### template-service
      - endpoints: /template-service/**

  storage: |
    storage:
      default-rendition-repository: renrepo
      repositories:
        s3_path_tenant_date_csid:
          profiles: ['s3profile_path_tenant_date_csid']
          default: true
        s3_with_path:
          profiles: ['s3profile_with_path']
          default: false
        s3:
          profiles: ['s3profile1']
          default: false
        archive_s3:
          profiles: ['s3profile2']
          default: false
        renrepo:
          profiles: ['s3renrepo']
          default: false
      profiles:
        s3:
          s3profile_path_tenant_date_csid:
            access-key: 'MGMWCOYTDUSLNCFE'
            secret-key: 'changeme'
            url: 'http://minio.infrastructure:9000'
            bucket: 'dmscloudrepodocker'
            pathTemplate: '{tenant}-{objectTypeId}/{DATE(yyyy)}/{DATE(MM)}/{DATE(dd)}/{contentStreamId.substring(0,2)}/{contentStreamId.substring(2,4)}/{contentStreamId.substring(4,6)}'
          s3profile1:
            access-key: 'MGMWCOYTDUSLNCFE'
            secret-key: 'changeme'
            url: 'http://minio.infrastructure:9000'
            bucket: 'dmscloudrepodocker'
          s3profile_with_path:
            access-key: 'MGMWCOYTDUSLNCFE'
            secret-key: 'changeme'
            url: 'http://minio.infrastructure:9000'
            bucket: 'dmscloudrepodocker'
            pathTemplate: '{tenant}-{objectTypeId}/{DATE(yyyy)}/{DATE(MM)}/{DATE(dd)}'
          s3profile2:
            access-key: 'MGMWCOYTDUSLNCFE'
            secret-key: 'changeme'
            url: 'http://minio.infrastructure:9000'
            bucket: 's3archive'
            pathTemplate: '{tenant}-{objectTypeId}/{DATE(yyyy)}/{DATE(MM)}/{DATE(dd)}'
          s3renrepo:
            access-key: 'MGMWCOYTDUSLNCFE'
            secret-key: 'changeme'
            url: 'http://minio.infrastructure:9000'
            bucket: 'rendition'
            pathTemplate: '{contentStreamId.substring(0,2)}/{contentStreamId.substring(2,4)}/{contentStreamId.substring(4,6)}'

  oauth2: |
    # configuration for the yuuvis authentication service
    keycloak.host: {{.Values.yuuvis.keycloak.publicaddress}}
    authentication.filter: oauth2
    authentication.provider: oauth2
    authentication.exposed.endpoints: ''
    authentication.oauth2.tenants:
    # example
    #- name: example
    #  clientId: yuuvis-authentication-service
    #  clientSecret: <my-secret>
    #  userAuthorizationUri: ${keycloak.host}/realms/example/protocol/openid-connect/auth
    #  accessTokenUri: ${keycloak.host}/realms/example/protocol/openid-connect/token
    #  userInfoUri: ${keycloak.host}/realms/example/protocol/openid-connect/userinfo
    #  endSessionUri: ${keycloak.host}/realms/example/protocol/openid-connect/logout
    #  userNameExtractionPattern: $.sub
    # configuration for the yuuvis organization service
    keycloak.server: {{.Values.yuuvis.keycloak.clusterurl}}
    keycloak.admin.username: {{.Values.yuuvis.init.keycloak.admin}}
    keycloak.admin.password: {{.Values.yuuvis.init.keycloak.password}}
  coreextension: |
    yuuvis:
      service-user:
        tenant: ${YUUVIS_SERVICEUSER_TENANT:unset_ym_su_tenant}
        user: ${YUUVIS_SERVICEUSER_USER:unset_ym_su_user}
        password: ${YUUVIS_SERVICEUSER_PASSWORD:unset_ym_su_password}
    corex:
      drive:
        app-name: drive
        name-property: appOsdrive:fileName
        file-type: system:document
        file-sots: [appOsdrive:file]
        folder-type: system:folder
        folder-sots: [appOsdrive:file]
        locks:
          waitTimeSeconds: 3
          cacheTimeSeconds: 30
          leaseTimeSeconds: 10
      webdav:
        rootPath: /webdav
        drivePath: OS Drive
        searchPaths:
          - name: Recently edited
            maxHits: 20
            query: "SELECT * FROM appOsdrive:file WHERE system:baseTypeId <> 'system:folder' AND system:lastModifiedBy = @userId ORDER BY system:lastModificationDate DESC"
        autoRename: true
  apiconfig: | 
    routing.endpoints:
    - endpoint: '/api/dms/objects/{objectId}/contents/file/{index}/**'
      methods: 'post,get,head' # if not set, all methods are taken
      destination: 'http://core-extensions'
  systemschema: |
    <?xml version="1.0" encoding="UTF-8" standalone="yes"?>
    <schema xmlns="http://optimal-systems.org/ns/dmscloud/schema/v5.0/">
      <version>1</version>
      <lastModificationDate>2017-11-13T06:02:42.56</lastModificationDate>
      <propertyDateTimeDefinition>
        <id>date</id>
        <localNamespace>urn:optimal-systems.de:dmscloud:dokument</localNamespace>
        <description>the date of the document???</description>
        <propertyType>datetime</propertyType>
        <cardinality>single</cardinality>
        <required>false</required>
      </propertyDateTimeDefinition>
      <propertyStringDefinition>
        <id>Name</id>
        <propertyType>string</propertyType>
        <cardinality>single</cardinality>
        <required>false</required>
      </propertyStringDefinition>
      <typeDocumentDefinition>
        <id>document</id>
        <localNamespace>urn:optimal-systems.de:dmscloud:document</localNamespace>
        <description>...</description>
        <baseId>system:document</baseId>
        <propertyReference>Name</propertyReference>
        <propertyReference>date</propertyReference>
        <contentStreamAllowed>required</contentStreamAllowed>
        <secondaryObjectTypeId>system:rmDestructionRetention</secondaryObjectTypeId>
      </typeDocumentDefinition>
    </schema>
  systemroleset: |
    <?xml version="1.0" encoding="utf-8"?>
        <roleSet xmlns="http://optimal-systems.org/ns/dmscloud/roleset/">
          <role>
            <name>YUUVIS_DEFAULT</name>
            <permission>
              <action>create</action>
              <action>read</action>
              <action>write</action>
              <action>delete</action>
            </permission>
          </role>
          <role>
            <name>YUUVIS_TENANT_ADMIN</name>
            <permission>
              <action>create</action>
      <action>read</action>
              <action>write</action>
              <action>delete</action>
            </permission>
          </role>
          <role>
            <name>YUUVIS_SYSTEM_INTEGRATOR</name>
            <permission>
              <action>create</action>
              <action>read</action>
              <action>write</action>
              <action>delete</action>
            </permission>
          </role>
        </roleSet>      
  systemHookConfiguration: |
    {"systemhooks" :
      {"amqp" : [],
       "lifecycle" : [ 
         {
           "type" : "dms.request.objects.upsert.database-before",
           "enable" : true,
           "predicate" : "spel:T(java.util.List).of(100,101).contains(options['action']) && contentStreams != null && contentStreams.size() > 0 && contentStreams[0]['range'] != null",
           "tagname" : "system:ren:text",
           "tagstate" : 1
         }
       ],
       "webhooks": [
         {
           "enable": true,
           "predicate": "spel:true",
           "type": "user.info",
           "url": "http://system/api/userinfo/${tenant}/${userId}"
         }
       ]
     }
    }
  systemProd: |
    schema.changed.observers: /rest-ws/refreshschema?global=%s, /sothook/schema/refresh?global=%s, /primarysothook/schema/refresh?global=%s
    user.info.filter.add-authority.blacklist: YUUVIS_SYSTEM_INTEGRATOR, YUUVIS_TENANT_ADMIN
  serviceConfiguration: |
    {"services": {
       "contentanalyzer": {
         "analyze": [				
          {
            "predicate": "spel:(properties != null && properties['Name'] != null && properties['Name']['value'] == 'disable') ? true : false",
            "mimetype": true,
            "content": false
          },				
          {
            "predicate": "spel:(contentStreams != null && contentStreams.size() > 0 && contentStreams[0]['range'] != null && contentStreams[0]['range'].length() > 0) ? true : false",
            "mimetype": false,
            "content": false
          }
          ]
        }
      }
    }
  dbconfig: |
    yuuvis.db.name: {{.Values.yuuvis.db.name}}
    yuuvis.db.server: {{.Values.yuuvis.db.server}}
    yuuvis.db.username: {{.Values.yuuvis.db.user}}
    yuuvis.db.password: {{.Values.yuuvis.db.password}}
    storage:
      databases:   
        defaultdb:
          datasource: defaultds
          predicate: 'spel:false'
          default: true
      datasources:
        defaultds:
          url: jdbc:postgresql://${yuuvis.db.server}/${yuuvis.db.name}
          username: ${yuuvis.db.username}
          password: ${yuuvis.db.password}
          driver-class-name: org.postgresql.Driver
  mqconfig: |
    # amqp
    amqp:
      host: {{.Values.yuuvis.amqp.url}}
      port: {{.Values.yuuvis.amqp.port}}
      user: {{.Values.yuuvis.amqp.user}}
      password: {{.Values.yuuvis.amqp.password}}
  # api, system query the kubernetes api server for instances of other momentum services
  # only services with metadata matching this filter will be used
  kubernetesclientconfig: |
    spring.cloud.kubernetes.discovery.filter: metadata!=null && metadata.labels!=null && metadata.labels['yuuvis']=="true"
  redisconfig: |
    spring.redis.port: {{.Values.yuuvis.redis.port}}
    spring.redis.host: {{.Values.yuuvis.redis.host}}
  esconfig: |
    storage:
      searchdatabases:
        database1:
          datasource: dbsource1
          predicate: 'spel:false'
          default: true
      searchdatasources:
        dbsource1:
          urls: '{{.Values.yuuvis.elastic.url}}:9200'
          index: {{.Values.yuuvis.elastic.init.index.name}}
          timeout: 60000
          # will only be used once, when creating the index
          creation:
            settings:
              number_of_shards: {{.Values.yuuvis.elastic.init.index.number_of_shards}}
              number_of_replicas: {{.Values.yuuvis.elastic.init.index.number_of_replicas}}
              codec: best_compression
              max_result_window: 2147483642
              mapping:
                total_fields:
                  limit: 10000
  osdriveAppSchema: |
    <?xml version="1.0" encoding="UTF-8" standalone="yes"?>
    <schema xmlns="http://optimal-systems.org/ns/dmscloud/schema/v5.0/">
        <propertyStringDefinition>
            <id>appOSDrive:fileName</id>
            <propertyType>string</propertyType>
            <cardinality>single</cardinality>
            <required>true</required>
        </propertyStringDefinition>

        <typeSecondaryDefinition>
            <id>appOSDrive:file</id>
            <baseId>system:secondary</baseId>
            <propertyReference>appOSDrive:fileName</propertyReference>
        </typeSecondaryDefinition>
    </schema>
  osDriveSystemHookConfiguration: |
    {
      "systemhooks" : {
        "amqp" : null,
        "lifecycle" : null,
        "webhooks" : [ {
          "enable" : true,
          "predicate" : "spel:properties['system:secondaryObjectTypeIds']!=null && properties['system:secondaryObjectTypeIds']['value'].contains('appOsdrive:file')",
          "type" : "dms.request.objects.upsert.database-before",
          "url" : "http://core-extensions/hooks/request/upsert/dbb/drive",
          "useDiscovery" : false
        }, {
          "enable" : true,
          "predicate" : "spel:properties['system:secondaryObjectTypeIds']!=null && properties['system:secondaryObjectTypeIds']['value'].contains('appOsdrive:file')",
          "type" : "dms.response.objects.delete",
          "url" : "http://core-extensions/hooks/response/delete/drive",
          "useDiscovery" : false
        } ]
      }
    }
  image:
    imagePullPolicy: IfNotPresent
    dockerRegistry: docker.yuuvis.org
    imagePullSecret: yuuvisorg
  # set environment variables that should be used in every container
  # e.g. time zone (TZ)
  # the whole block will be added to the environment variables in the containers
  common:
    env: 
    #example:
    #env:
    #  - name: TZ
    #    value: "Europe/Berlin"
  livenessProbe:
    enable: true
    initialDelaySeconds: 300
    periodSeconds: 30
    timeoutSeconds: 10
    path: /manage/info
  readinessProbe:
    enable: true
    initialDelaySeconds: 0
    periodSeconds: 30
    timeoutSeconds: 5
    path: /manage/health
  securityContext:
    fsGroup: 1000
    runAsGroup: 1000
    runAsUser: 1000
    runAsNonRoot: true
  labels:
    app: yuuvis
  services:
    api:
      dockerImage: yuuvis/api-gateway
      tag: 2025.4.9
      profiles: prod,redis,kubernetes,metrics
      instances: 1
      pdb:
        # pdb requires instances > 1 and minAvailable < instances,
        # otherwise draining nodes will deadlock!
        enabled: false

        # set `minAvailable: null` if you want to use maxUnavailable instead
        minAvailable: 1
      java:
        maxHeap: -Xmx512m -XX:+ExitOnOutOfMemoryError
      port: 7450
      resources:
        requests:
          memory: "512Mi"
        #  cpu:
        #limits:
        #  memory:
        #  cpu: 
      nodeSelector: {}
      priorityClassName: ""
      tolerations: []
      nodeAffinity: {}
      podAffinity: {}
      podAntiAffinity: {}
    authentication:
      # create services with type nodport for authentication
      nodeport:
        use: false
        value: 30080
      ingress:
        enabled: false
        classname: nginx
        certmanager: |
          cert-manager.io/cluster-issuer: letsencrypt-prod
        annotations: | 
          ingress.kubernetes.io/proxy-buffer-size: 32k
          ingress.kubernetes.io/ssl-redirect: "true"
          nginx.ingress.kubernetes.io/cors-allow-credentials: 'true'
          nginx.ingress.kubernetes.io/cors-allow-headers: >-
            Authorization,X-ID-TENANT-NAME,DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range
          nginx.ingress.kubernetes.io/cors-allow-methods: PUT, GET, POST, OPTIONS, PATCH, DELETE
          nginx.ingress.kubernetes.io/cors-allow-origin: '*'
          nginx.ingress.kubernetes.io/enable-cors: 'true'
          nginx.ingress.kubernetes.io/force-ssl-redirect: 'true'
          nginx.ingress.kubernetes.io/proxy-body-size: 0
          nginx.ingress.kubernetes.io/proxy-buffer-size: 32k
          nginx.ingress.kubernetes.io/proxy-read-timeout: '1800'
          nginx.ingress.kubernetes.io/proxy-send-timeout: '1800'
          nginx.ingress.kubernetes.io/rewrite-target: "/"
      dockerImage: yuuvis/authentication
      tag: 2025.4.9
      profiles: prod,oauth2,redis,kubernetes,metrics
      instances: 1
      pdb:
        # pdb requires instances > 1 and minAvailable < instances,
        # otherwise draining nodes will deadlock!
        enabled: false

        # set `minAvailable: null` if you want to use maxUnavailable instead
        minAvailable: 1
      port: 8080
      # for the manage endpoints a dedicated port is used
      managePort: 9091
      internalPort: 8081
      resources:
        requests:
          memory: "512Mi"
        #  cpu:
        #limits:
        #  memory:
        #  cpu: 
      java:
        maxHeap: -Xmx512m -XX:+ExitOnOutOfMemoryError
      volumes: |
        - name: keycloak-tls-selfsigned
          secret:
            defaultMode: 420
            secretName: keycloak-selfsigned-cert-secret
      volumeMounts: |
        - mountPath: /etc/yuuvis/certs
          name: keycloak-tls-selfsigned
      nodeSelector: {}
      priorityClassName: ""
      tolerations: []
      nodeAffinity: {}
      podAffinity: {}
      podAntiAffinity: {}
    index:
      dockerImage: yuuvis/index
      profiles: prod,es,kubernetes,redis,metrics
      tag: 2025.4.9
      instances: 1
      pdb:
        # pdb requires instances > 1 and minAvailable < instances,
        # otherwise draining nodes will deadlock!
        enabled: false

        # set `minAvailable: null` if you want to use maxUnavailable instead
        minAvailable: 1
      port: 7291
      java:
        maxHeap: -Xmx1024m -XX:+ExitOnOutOfMemoryError
      resources:
        requests:
          memory: "1024Mi"
        #  cpu:
        #limits:
        #  memory:
        #  cpu: 
      nodeSelector: {}
      priorityClassName: ""
      tolerations: []
      nodeAffinity: {}
      podAffinity: {}
      podAntiAffinity: {}
    registry:
      dockerImage: yuuvis/registry
      tag: 2025.4.9
      profiles: prod,jpapostgres,dbs,redis,kubernetes,metrics
      instances: 1
      pdb:
        # pdb requires instances > 1 and minAvailable < instances,
        # otherwise draining nodes will deadlock!
        enabled: false

        # set `minAvailable: null` if you want to use maxUnavailable instead
        minAvailable: 1
      port: 7510
      java:
        maxHeap: -Xmx1024m -XX:+ExitOnOutOfMemoryError
      resources:
        requests:
          memory: "1024Mi"
        #  cpu:
        #limits:
        #  memory:
        #  cpu: 
      # service may perform db updates, with possible long duration
      # service uses liquibase, if killed during startup db lock possibly never released
      # as a precaution disable livenessProbe during first of a new version 
      # once the update is complete enable livenessProbe
      livenessProbe:
        # values true/false
        enable: false
      nodeSelector: {}
      priorityClassName: ""
      tolerations: []
      nodeAffinity: {}
      podAffinity: {}
      podAntiAffinity: {}
    repository:
      dockerImage: yuuvis/repository
      tag: 2025.4.9
      profiles: prod,storage,kubernetes,redis,metrics
      instances: 2
      pdb:
        # pdb requires instances > 1 and minAvailable < instances,
        # otherwise draining nodes will deadlock!
        enabled: false

        # set `minAvailable: null` if you want to use maxUnavailable instead
        minAvailable: 1
      port: 7500
      maxRequests: 100
      java:
