apiVersion: v1
data:
  gitInitRepo.sh: |-
    set -e
    until $(curl --output /dev/null --silent --head --fail http://gitea-http:3000);
    do 
      echo 'waiting for gitea'
      sleep 5;
    done

    sleep 2
    
    if [ "$GITINITLOG" = "DEBUG" ]; then
      echo "create user: $GITUSER with existing user: $GITADMINUSER"
    else
      echo 'create user'
    fi
    
    response=$(curl -s -w "%{http_code}" -X 'POST' \
    "http://$GITADMINUSER:$GITADMINPASSWORD@gitea-http:3000/api/v1/admin/users" \
    -H 'accept: application/json' \
    -H 'Content-Type: application/json' \
    -d "{
       \"email\": \"$GITUSER@yuuvis.com\",
       \"must_change_password\": false,
       \"password\": \"$GITPASSWORD\",
       \"username\": \"$GITUSER\"
    }")
    
    # Split JSON body and HTTP code
    http_code="${response: -3}"
    body="${response:: -3}"
    
    if [ "$GITINITLOG" = "DEBUG" ]; then   
       echo "Response JSON:"
       echo "$body"
    fi
    
    if [[ "$http_code" -ge 400 ]]; then
      echo "User creation failed with HTTP code $http_code"
      return 1
    else
      echo "User creation successful (HTTP $http_code)"
    fi
    
    echo 'create git repository'
    response=$(curl -s -w "%{http_code}" -X 'POST' "http://$GITUSER:$GITPASSWORD@gitea-http:3000/api/v1/user/repos"   -H 'accept: application/json'   -H 'Content-Type: application/json'   -d '{
      "auto_init": true,
      "default_branch": "main",
      "description": "yuuvis config files",
      "name": "yuuvis-config",
      "private": true,
      "template": true,
      "trust_model": "default"
    }')
    
    http_code="${response: -3}"
    body="${response:: -3}"

    if [ "$GITINITLOG" = "DEBUG" ]; then   
       echo "Response JSON:"
       echo "$body"
    fi

    if [[ "$http_code" -ge 400 ]]; then
      echo "Repository creation failed with HTTP code $http_code"
      return 1
    else
      echo "Repository creation successful (HTTP $http_code)"
    fi
kind: ConfigMap
metadata:
  name: gitinitrepo
