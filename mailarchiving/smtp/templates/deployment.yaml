apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: {{.Values.yuuvis.labels.app}}
    name: mailarchiving-smtp
  name: mailarchiving-smtp
spec:
  replicas: {{.Values.yuuvis.mailarchiving.smtp.instances}}
  selector:
    matchLabels:
      name: mailarchiving-smtp
  template:
    metadata:
      labels:
        name: mailarchiving-smtp
    spec:
      {{- if or .Values.yuuvis.mailarchiving.smtp.nodeAffinity .Values.yuuvis.mailarchiving.smtp.podAffinity .Values.yuuvis.mailarchiving.smtp.podAntiAffinity }}
      affinity:
        {{- with .Values.yuuvis.mailarchiving.smtp.nodeAffinity }}
        nodeAffinity: {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with .Values.yuuvis.mailarchiving.smtp.podAffinity }}
        podAffinity: {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with .Values.yuuvis.mailarchiving.smtp.podAntiAffinity }}
        podAntiAffinity: {{- toYaml . | nindent 10 }}
        {{- end }}
      {{- end }}
      initContainers:
        - name: init-mailarchiving-smtp
          image: "{{.Values.yuuvis.image.dockerRegistry}}/{{.Values.initContainer.image}}:{{.Values.initContainer.tag}}"
          imagePullPolicy: {{.Values.initContainer.imagePullPolicy}}
          command: [ "sh", "-c", "{{.Values.initContainer.command}}" ]
          {{- if .Values.initContainer.securityContext }}
          securityContext:
          {{- toYaml .Values.initContainer.securityContext | nindent 12 }}
          {{- end }}
      containers:
        - name: mailarchiving-smtp
          image: "{{.Values.yuuvis.mailarchiving.smtp.dockerRegistry}}:{{.Values.yuuvis.mailarchiving.smtp.tag}}"
          imagePullPolicy: {{.Values.yuuvis.image.imagePullPolicy}}
          env:
            - name: JAVA_OPTS
              value: {{.Values.yuuvis.mailarchiving.smtp.java.maxHeap}}
            - name: SPRING_PROFILES_ACTIVE
              value: prod,docker,kubernetes
            - name: SPRING_CLOUD_CONFIG_URI
              value: {{.Values.yuuvis.configservice.url}}/config
          volumeMounts:
            - name: tls
              mountPath: /mailarchiving-tls
          {{- with .Values.yuuvis.mailarchiving.smtp.resources }}
          resources: {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if .Values.yuuvis.mailarchiving.smtp.livenessProbe.enable }}
          livenessProbe:
            httpGet:
              path: {{.Values.yuuvis.mailarchiving.smtp.livenessProbe.path}}
              port: {{.Values.yuuvis.mailarchiving.smtp.port}}
            initialDelaySeconds: {{.Values.yuuvis.mailarchiving.smtp.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{.Values.yuuvis.mailarchiving.smtp.livenessProbe.periodSeconds }}
            timeoutSeconds: {{.Values.yuuvis.mailarchiving.smtp.livenessProbe.timeoutSeconds }}
          {{- end}}
          {{- if .Values.yuuvis.mailarchiving.smtp.readinessProbe.enable }}
          readinessProbe:
            httpGet:
              path: {{.Values.yuuvis.mailarchiving.smtp.readinessProbe.path}}
              port: {{.Values.yuuvis.mailarchiving.smtp.port}}
            initialDelaySeconds: {{.Values.yuuvis.mailarchiving.smtp.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{.Values.yuuvis.mailarchiving.smtp.readinessProbe.periodSeconds }}
            timeoutSeconds: {{.Values.yuuvis.mailarchiving.smtp.readinessProbe.timeoutSeconds }}
          {{- end}}
          securityContext:
            allowPrivilegeEscalation: true
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
      volumes:
        - name: tls
          secret:
            secretName: mailarchiving-smtp-selfsigned-tls-secret
      imagePullSecrets:
      - name: {{.Values.yuuvis.image.imagePullSecret}}
      restartPolicy: {{ .Values.yuuvis.mailarchiving.smtp.restartPolicy }}
      {{- with .Values.yuuvis.mailarchiving.smtp.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.yuuvis.mailarchiving.smtp.priorityClassName }}
      priorityClassName: {{ .Values.yuuvis.mailarchiving.smtp.priorityClassName }}
      {{- end }}
      {{- with .Values.yuuvis.mailarchiving.smtp.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        fsGroup: {{.Values.yuuvis.mailarchiving.smtp.securityContext.fsGroup}}
        runAsGroup: {{.Values.yuuvis.mailarchiving.smtp.securityContext.runAsGroup}}
        runAsUser: {{.Values.yuuvis.mailarchiving.smtp.securityContext.runAsUser}}
        runAsNonRoot: {{.Values.yuuvis.mailarchiving.smtp.securityContext.runAsNonRoot}}
        seccompProfile:
          type: RuntimeDefault
