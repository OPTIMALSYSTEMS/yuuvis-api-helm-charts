apiVersion: v1
kind: Service
metadata:
  labels:
    app: {{.Values.yuuvis.labels.app}}
    name: mailarchiving-smtp
  name: mailarchiving-smtp
spec:
  ports:
    - name: http
      port: 80
      targetPort: {{.Values.yuuvis.mailarchiving.smtp.port}}
    - name: smtp
      port: 25
      targetPort: 25000
  selector:
    name: mailarchiving-smtp
  type: ClusterIP