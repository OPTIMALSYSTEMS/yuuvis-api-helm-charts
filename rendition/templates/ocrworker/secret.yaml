{{- if .Values.yuuvis.ocrworker.yuuvis.user.createnewsecret -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.yuuvis.ocrworker.yuuvis.user.secretname }}
type: Opaque
data:
  tenant: {{ .Values.yuuvis.ocrworker.yuuvis.user.tenant | b64enc | quote }}
  user: {{ .Values.yuuvis.ocrworker.yuuvis.user.username | b64enc | quote }}
  password: {{ .Values.yuuvis.ocrworker.yuuvis.user.password | b64enc | quote }}
{{- if and .Values.yuuvis.ocrworker.yuuvis.user.createnewsecret  .Values.yuuvis.ocrworker.yuuvis.user.createuser.enabled }}
  email: {{ .Values.yuuvis.ocrworker.yuuvis.user.createuser.email | b64enc | quote }}
  keycloakadmin: {{ .Values.yuuvis.ocrworker.yuuvis.user.createuser.keycloak.admin | b64enc | quote }}
  keycloakadminpassword: {{ .Values.yuuvis.ocrworker.yuuvis.user.createuser.keycloak.adminpassword | b64enc | quote }}
{{- end -}}
{{- end -}}
